[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-failure-explainer"
version = "0.1.0"
description = "Explains failed CI logs in plain language, with prompt-injection guardrails, evidence checking, human review, and an evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
web = ["streamlit>=1.40", "python-dotenv>=1.0", "anthropic>=0.40", "SQLAlchemy>=2.0", "mysql-connector-python>=9.0"]
dev = ["pytest>=7", "SQLAlchemy>=2.0"]

[project.scripts]
ci-explainer = "ci_explainer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
